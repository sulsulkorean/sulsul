name: Release Reviewed Posts (10:30 AM KST)

on:
  schedule:
    # 01:30 UTC = 10:30 KST
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: release-reviewed-blog-posts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Release the next two reviewed posts
        run: python3 tools/release_scheduled_posts.py --count 2

      - name: Check whether anything changed
        id: changed
        run: |
          if [ -n "$(git status --porcelain _scheduled _posts)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install site dependencies
        if: steps.changed.outputs.found == 'true'
        run: npm ci

      - name: Check public copy and build the site
        if: steps.changed.outputs.found == 'true'
        run: |
          python3 tools/check_public_copy.py
          npm run build

      - name: Publish the verified batch
        if: steps.changed.outputs.found == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _scheduled _posts
          git commit -m "Release two reviewed Korean speaking posts"
          git push origin main
