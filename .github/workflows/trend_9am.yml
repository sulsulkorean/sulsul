name: Trend K-Culture Posts (9 AM KST)

# Daily: 2 K-culture / trend posts. Gate-pass → push main → Vercel.
# SCHEDULE OFF 2026-08-07: OpenAI API paused. Use macOS launchd + Cursor SDK instead
# (scripts/run_blog_trend_9am.sh). Manual only here:
on:
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai duckduckgo-search Pillow

      - name: Write Trend Posts (2 max)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI }}
          SULSUL_BLOG_MODEL: gpt-4o
        run: |
          python3 generate_seo_posts.py --mode trend --count 2

      - name: Check nothing internal reached the public copy
        run: |
          python3 tools/check_public_copy.py

      - name: Keep rejected drafts out of the public repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-drafts-trend
          path: _rejected/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish to main when drafts passed
        id: publish
        run: |
          set -e
          if [ -z "$(git status --porcelain _posts public/assets/blog/scenes)" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "올릴 글이 없습니다. 블로그는 그대로입니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add _posts public/assets/blog/scenes
          git commit -m "Auto: trend K-culture posts (quality-gated, max 2)"
          git push origin HEAD:main
          echo "main에 push했습니다. Vercel 배포를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
