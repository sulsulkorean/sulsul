name: Trend SEO Post Generator (9 AM KST)

on:
  schedule:
    # 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai duckduckgo-search

      - name: Run Trend SEO Script (2 posts/day)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI }}
          SULSUL_BLOG_MODEL: gpt-4o
        run: |
          python3 generate_seo_posts.py --mode trend --count 2

      - name: Check nothing internal reached the public copy
        run: |
          python3 tools/check_public_copy.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _posts _rejected || true
          git commit -m "Auto: trend SEO posts (quality-gated, max 2)" || echo "No changes to commit"
          git push origin main
