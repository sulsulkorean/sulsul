name: Textbook SEO Post Generator (9 PM KST)

on:
  schedule:
    # 12:00 UTC = 21:00 KST — Mon-Fri only
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai duckduckgo-search

      - name: Run Textbook SEO Script (3 posts, weekdays)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI }}
          SULSUL_BLOG_MODEL: gpt-4o
        run: |
          python3 generate_seo_posts.py --mode textbook --count 3

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _posts _rejected || true
          git commit -m "Auto: textbook SEO posts (quality-gated, max 3)" || echo "No changes to commit"
          git push origin main
