name: Textbook SEO Post Generator (9 PM KST)

on:
  schedule:
    # 12:00 UTC는 한국 시간으로 밤 9:00 입니다.
    - cron: '0 12 * * *'
  workflow_dispatch: # 수동 실행 버튼 허용

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai duckduckgo-search

      - name: Run Textbook SEO Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 generate_seo_posts.py --mode textbook --count 10

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-generated Textbook SEO posts (9 PM)" || echo "No changes to commit"
          git push origin main
